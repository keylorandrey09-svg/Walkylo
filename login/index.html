<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walkylet — Iniciar sesión</title>
  <meta name="theme-color" content="#F6F7F8" />
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* Tokens, fuentes y base en /brand.css (capa "brand": estas reglas ganan sin pelear especificidad).
       Login: página --surface, caja --bg con borde, un solo botón negro lleno. */
    @import url("/brand.css") layer(brand);

    body{display:flex;flex-direction:column;min-height:100dvh;background:var(--surface);-webkit-tap-highlight-color:transparent;}
    a{text-decoration:none;}
    a:hover{text-decoration:underline;}

    .lg-head{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;padding-inline:16px;}
    .lg-back{display:inline-flex;align-items:center;min-height:44px;font-size:.9375rem;color:var(--text-2);}
    .lg-back:hover{color:var(--text);text-decoration:none;}

    .lg-main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px 64px;}
    .lg-card{width:100%;max-width:400px;padding:24px;background:var(--bg);border:1px solid var(--border);border-radius:10px;}
    .lg-title{font-size:1.5rem;line-height:1.2;font-weight:500;letter-spacing:-0.01em;margin-bottom:8px;}
    .lg-sub{font-size:.9375rem;color:var(--text-2);margin-bottom:24px;}

    .lg-field{margin-bottom:16px;}
    .lg-label{display:block;margin-bottom:8px;font-size:.875rem;font-weight:500;}
    .lg-input-wrap{position:relative;}
    .lg-input{width:100%;height:44px;padding:0 12px;font:inherit;font-size:1rem;color:var(--text);
      background:var(--bg);border:1px solid var(--border);border-radius:6px;transition:border-color .15s;}
    .lg-input-wrap .lg-input{padding-right:44px;}
    .lg-input::placeholder{color:var(--text-2);}
    .lg-input:focus{border-color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 25%,transparent);outline-offset:0;}
    .lg-input.has-err{border-color:var(--danger);}
    .lg-eye{position:absolute;top:0;right:0;width:44px;height:44px;display:grid;place-items:center;
      background:none;border:0;border-radius:6px;color:var(--text-2);cursor:pointer;}
    .lg-eye:hover{color:var(--text);}
    .lg-row{display:flex;justify-content:flex-end;margin:-8px 0 16px;}
    .lg-forgot{min-height:44px;padding:0;background:none;border:0;font-size:.875rem;color:var(--accent);cursor:pointer;}
    .lg-forgot:hover{text-decoration:underline;}

    .lg-btn{width:100%;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;
      font:500 .9375rem/1 var(--font);border:1px solid transparent;border-radius:6px;cursor:pointer;}
    .lg-btn-primary{background:var(--text);color:var(--bg);}
    .lg-btn-primary:hover{background:#2A2D33;}
    .lg-btn-primary:disabled{opacity:.7;cursor:progress;}
    .lg-btn-ghost{background:none;border-color:var(--border);color:var(--text);}
    .lg-btn-ghost:disabled{color:var(--text-2);cursor:not-allowed;}
    .lg-soon{font-size:.8125rem;}

    .lg-alert{display:none;align-items:flex-start;gap:8px;margin-bottom:16px;padding:10px 12px;font-size:.875rem;line-height:1.5;
      color:var(--danger);border:1px solid var(--danger);border-radius:6px;}
    .lg-alert.is-on{display:flex;}
    .lg-alert.is-ok{color:var(--text);background:var(--surface);border-color:var(--border);}
    .lg-alert .icon{width:16px;height:16px;margin-top:2px;}
    .lg-alert.is-ok .icon{display:none;}

    .lg-sep{display:flex;align-items:center;gap:12px;margin:24px 0;font-size:.8125rem;color:var(--text-2);}
    .lg-sep::before,.lg-sep::after{content:"";flex:1;height:1px;background:var(--border);}
    .lg-foot{margin-top:16px;text-align:center;font-size:.9375rem;color:var(--text-2);}
    .lg-foot a{display:inline-block;padding-block:10px;}

    @media (min-width: 480px){
      .lg-head{padding-inline:24px;}
      .lg-main{padding-top:clamp(32px,8vh,96px);}
      .lg-card{padding:32px;}
    }
  </style>

  <main class="lg-main">
    <div class="lg-card">
      <h1 class="lg-title">Iniciá sesión</h1>
      <p class="lg-sub">Entrá a tu panel de Walkylet.</p>

      <div class="lg-alert" id="lgAlert" aria-live="polite">

      <form id="lgForm" novalidate>
        <div class="lg-field">

        <div class="lg-row"><button class="lg-forgot" id="lgForgot" type="button">¿Olvidaste tu contraseña?</button></div>

  <script>
  (function(){
    "use strict";
    /* ============================================================
       LOGIN (UI). La autenticación REAL va en el chat guía (Supabase Auth).
       Enganches:
         - TODO Supabase: signInWithPassword(email, pass) -> si ok, redirigir a /app.
         - TODO Supabase: proteger /app (sin sesión -> /login).
         - TODO Supabase: "¿Olvidaste tu contraseña?" -> resetPasswordForEmail.
         - TODO Supabase: "Creá una" -> registro (signUp).
         - Google queda para después (botón deshabilitado).
       ============================================================ */
    var sb = window.supabase.createClient(window.WSB_URL, window.WSB_ANON);

    var form = document.getElementById('lgForm');
    var email = document.getElementById('lgEmail');
    var pass = document.getElementById('lgPass');
    var submit = document.getElementById('lgSubmit');
    var submitTx = submit.querySelector('.lg-btn-tx');
    var alertBox = document.getElementById('lgAlert');
    var alertText = document.getElementById('lgAlertText');
    var eye = document.getElementById('lgEye');
    var title = document.querySelector('.lg-title');
    var sub = document.querySelector('.lg-sub');
    var foot = document.querySelector('.lg-foot');

    var mode = 'signin'; // 'signin' | 'signup'

    function showError(msg, ok){
      alertText.textContent = msg;
      alertBox.classList.add('is-on');
      alertBox.classList.toggle('is-ok', !!ok); // aviso (no error): texto --text sobre --surface
    }
    function clearError(){ alertBox.classList.remove('is-on', 'is-ok'); email.classList.remove('has-err'); pass.classList.remove('has-err'); }
    function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
    function setLoading(on){ submit.disabled = on; submit.classList.toggle('is-loading', on); }

    function traducir(msg){
      msg = String(msg || '');
      if (/Invalid login credentials/i.test(msg)) return 'Correo o contraseña incorrectos.';
      if (/already registered|already been registered|User already/i.test(msg)) return 'Ese correo ya tiene una cuenta. Iniciá sesión.';
      if (/Email not confirmed/i.test(msg)) return 'Confirmá tu correo antes de entrar (revisá tu bandeja).';
      if (/rate limit|too many/i.test(msg)) return 'Demasiados intentos. Esperá un momento y probá de nuevo.';
      if (/Password should be at least/i.test(msg)) return 'La contraseña es muy corta.';
      return 'No se pudo completar. Probá de nuevo.';
    }

    function bindSignup(){
      var el = document.getElementById('lgSignup');
      if (el) el.addEventListener('click', function(e){ e.preventDefault(); setMode('signup'); });
    }
    function bindToSignin(){
      var el = document.getElementById('lgToSignin');
      if (el) el.addEventListener('click', function(e){ e.preventDefault(); setMode('signin'); });
    }

    function setMode(m){
      mode = m; clearError();
      if (m === 'signup'){
        title.textContent = 'Creá tu cuenta';
        sub.textContent = 'Empezá gratis con Walkylet.';
        submitTx.textContent = 'Crear cuenta';
        pass.setAttribute('autocomplete','new-password');
        foot.innerHTML = '¿Ya tenés cuenta? <a href="#" id="lgToSignin">Entrá</a>';
        bindToSignin();
      } else {
        title.textContent = 'Iniciá sesión';
        sub.textContent = 'Entrá a tu panel de Walkylet.';
        submitTx.textContent = 'Entrar';
        pass.setAttribute('autocomplete','current-password');
        foot.innerHTML = '¿No tenés cuenta? <a href="#" id="lgSignup">Creá una</a>';
        bindSignup();
      }
    }

    eye.addEventListener('click', function(){
      var show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      eye.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
    email.addEventListener('input', clearError);
    pass.addEventListener('input', clearError);

    form.addEventListener('submit', function(e){
      e.preventDefault();
      clearError();
      var em = email.value.trim(), pw = pass.value;
      if (!validEmail(em)){ email.classList.add('has-err'); showError('Ingresá un correo válido.'); email.focus(); return; }
      if (pw.length < 6){ pass.classList.add('has-err'); showError('La contraseña debe tener al menos 6 caracteres.'); pass.focus(); return; }
      setLoading(true);

      if (mode === 'signup'){
        sb.auth.signUp({ email: em, password: pw }).then(function(res){
          setLoading(false);
          if (res.error){ showError(traducir(res.error.message)); return; }
          if (res.data && res.data.session){ window.location.href = '/app'; return; } // sin confirmación de correo
          showError('Cuenta creada. Revisá tu correo para confirmarla y después entrá.', true); // con confirmación
          setMode('signin');
        }).catch(function(){ setLoading(false); showError('No se pudo conectar. Probá de nuevo.'); });
      } else {
        sb.auth.signInWithPassword({ email: em, password: pw }).then(function(res){
          setLoading(false);
          if (res.error){ showError(traducir(res.error.message)); return; }
          window.location.href = '/app';
        }).catch(function(){ setLoading(false); showError('No se pudo conectar. Probá de nuevo.'); });
      }
    });

    document.getElementById('lgForgot').addEventListener('click', function(){
      clearError();
      var em = email.value.trim();
      if (!validEmail(em)){ email.classList.add('has-err'); showError('Escribí tu correo arriba y volvé a tocar aquí.'); email.focus(); return; }
      sb.auth.resetPasswordForEmail(em, { redirectTo: window.location.origin + '/login' }).then(function(res){
        if (res.error){ showError(traducir(res.error.message)); return; }
        showError('Te enviamos un correo para restablecer la contraseña.', true);
      }).catch(function(){ showError('No se pudo enviar el correo. Probá de nuevo.'); });
    });

    // Si el usuario vuelve desde el correo de recuperación
    sb.auth.onAuthStateChange(function(event){
      if (event === 'PASSWORD_RECOVERY'){
        var np = prompt('Ingresá tu nueva contraseña (mínimo 6 caracteres):');
        if (np && np.length >= 6){
          sb.auth.updateUser({ password: np }).then(function(res){
            if (res.error){ showError(traducir(res.error.message)); }
            else { showError('Contraseña actualizada. Ya podés iniciar sesión.', true); }
          });
        }
      }
    });

    // Si ya hay sesión activa, directo al panel
    sb.auth.getSession().then(function(res){ if (res.data && res.data.session) window.location.replace('/app'); });

    bindSignup();

    // Si venís desde "Empezar gratis" (/login?signup) arrancá en modo crear cuenta
    if (/(?:[?&]signup|[#]registro)/i.test(location.search + location.hash)) setMode('signup');
  })();
  </script>
